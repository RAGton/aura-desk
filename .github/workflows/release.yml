name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release Draft
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or reuse single GitHub Release for tag
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 25,
            });
            const existing = releases.data.find((r) => r.tag_name === tag);
            if (existing) {
              core.setOutput("release_id", String(existing.id));
              return;
            }
            const created = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `AuraDesk ${tag}`,
              body: "See CHANGELOG.md for details.",
              draft: true,
              prerelease: false,
            });
            core.setOutput("release_id", String(created.data.id));

  release-auradesk:
    name: Release AuraDesk
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - if: matrix.platform == 'ubuntu-22.04'
        name: Install Linux system deps (Tauri 2.12)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/auradesk -> target

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm --filter @auradesk/web build

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Check Windows Azure Trusted Signing secrets
        id: check_signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if ($env:AZURE_CLIENT_ID -and $env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_SECRET) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Azure Trusted Signing secrets not configured; skipping Authenticode signature."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Sign Windows installers (Azure Trusted Signing, ADR-0010)
        if: matrix.platform == 'windows-latest' && steps.check_signing.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_CLIENT_ID && secrets.AZURE_TENANT_ID || '' }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: target/release/bundle
          files-folder-filter: "exe,msi"
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auradesk-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: ignore

  publish-release:
    name: Generate SHA256SUMS.txt & Publish Release
    needs: [create-release, release-auradesk]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-artifacts

      - name: Compute SHA256SUMS.txt & upload signed assets
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");

            const releaseId = Number(process.env.RELEASE_ID);
            const root = "/tmp/release-artifacts";
            const files = [];
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else files.push(full);
              }
            };
            walk(root);

            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            // Re-upload final installers (ensuring Windows signed assets replace unsigned ones cleanly)
            const checksumLines = [];
            for (const filePath of files) {
              const base = path.basename(filePath);
              const bytes = fs.readFileSync(filePath);
              const hash = crypto.createHash("sha256").update(bytes).digest("hex");
              checksumLines.push(`${hash}  ${base}`);

              const existing = release.assets.find((a) => a.name === base);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id,
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: base,
                data: bytes,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": bytes.length,
                },
              });
            }

            const sumsContent = checksumLines.sort().join("\n") + "\n";
            const existingSums = release.assets.find((a) => a.name === "SHA256SUMS.txt");
            if (existingSums) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existingSums.id,
              });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: "SHA256SUMS.txt",
              data: Buffer.from(sumsContent, "utf8"),
              headers: {
                "content-type": "text/plain; charset=utf-8",
                "content-length": Buffer.byteLength(sumsContent, "utf8"),
              },
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
            });
