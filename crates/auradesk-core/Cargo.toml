[package]
name = "auradesk-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
# Required by the `rust-i18n` 0.4.1 `i18n!` macro: it expands to
# `lazy_static::lazy_static! { static ref LOCALES ... }` in the calling
# crate, so we must declare `lazy_static` as a direct dep. Pinned to
# the same version the upstream macro uses (rust-i18n-macro 0.3.0).
lazy_static = "1.4"

[[bin]]
name = "check-strings"
path = "src/bin/check-strings.rs"
