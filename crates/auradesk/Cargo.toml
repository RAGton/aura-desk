[package]
name = "auradesk"
version = "0.2.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "auradesk"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
auradesk-core = { path = "../auradesk-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
