[package]
name = "auradesk-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "auradesk-mcp"
path = "src/main.rs"

[dependencies]
auradesk-core = { path = "../auradesk-core" }
rmcp = { version = "0.3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
